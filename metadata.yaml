name: astrbot_plugin_daily_news
display_name: 每日新闻聚合播报
desc: 手动或定时抓取并推送今日聚合新闻（分类订阅/关键词过滤/历史回看）
help: 发送「/新闻」手动抓取今日聚合新闻；「/新闻 <关键词>」按关键词搜索；「/新闻 <分类名>」分类订阅（科技/财经/体育等）；「/新闻 分类」列出可用分类；「/新闻 历史 [日期]」回看历史快照；配置定时播报可在每天固定时间自动推送到指定群
version: 1.1.0
author: 云晓
repo: https://github.com/yunxiao258/astrbot_plugin_daily_news
